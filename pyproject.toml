[project]
name = "xsynth"
version = "0.1.0"
description = "Hardware/software co-designed FPGA synthesizer for Tang Nano 9K"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "amaranth>=0.5.8",
    "amaranth-boards>=0.0.9",
    "apycula>=0.31",
    "numpy>=2.4.4",
    "pyserial>=3.5",
    "yowasp-nextpnr-himbaechel-gowin>=0.10.0.0.post753",
    "yowasp-yosys>=0.64.0.0.post1131",
]

[project.scripts]
xsynth = "xsynth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
